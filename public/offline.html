<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneksi Terputus - PRINTMASTER</title>
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8fafc;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        .offline-card {
            max-width: 450px;
            text-align: center;
            padding: 40px 30px;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="text-warning mb-3">
            <i class="bi bi-wifi-off display-1"></i>
        </div>
        <h4 class="fw-bold mb-2">Koneksi Internet Terputus</h4>
        <p class="text-muted small mb-4">
            Anda sedang dalam mode luar jaringan (offline). Beberapa fitur transaksi membutuhkan koneksi server aktif untuk memvalidasi data cabang.
        </p>
        <button onclick="window.location.reload()" class="btn btn-primary px-4 fw-semibold rounded-pill">
            <i class="bi bi-arrow-clockwise me-1"></i> Coba Sambungkan Kembali
        </button>
    </div>
</body>
</html>
